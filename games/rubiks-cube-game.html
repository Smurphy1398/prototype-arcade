<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0d1017">
  <title>Rubik's Cube</title>
  <meta name="description" content="A browser Rubik's Cube that teaches you to solve it, then times you like a competition.">
  <style>
/* Rubik's Cube — v2 polish.
 *
 * v1's cube itself was well styled, but the page around it had NO styling at all: all 13 layout
 * classes it emitted (.page-header, .move-grid, .action-row, .move, .action, ...) had zero
 * matching rules, so the controls flowed as inline text. That mismatch is what the owner saw.
 * This stylesheet dresses the whole page to the same standard as the cube.
 *
 * Two v1 traps deliberately avoided:
 *   1. NO bare [data-face] selector. v1 had one, and because every sticker also carried
 *      data-face, the page collapsed into a heap until JS stripped the attribute.
 *   2. NO transition on .cube. v1 transitioned it unconditionally, which would smear every
 *      drag by 220ms. The camera writes .cube's transform directly; only cubies transition.
 */

:root {
  --u: 62px;                       /* cubie size; JS overrides via --unit */
  --gap: 2px;
  --radius: 14px;

  --bg: #0d1017;
  --bg-glow: #171d2b;
  --surface: #151a24;
  --surface-2: #1c2230;
  --line: #2a3244;
  --text: #e8ecf4;
  --text-dim: #94a0b8;
  --accent: #4c8dff;
  --good: #38d39f;

  /* authentic Rubik's colours */
  --c-U: #f7f7f5;  /* up    - white  */
  --c-D: #ffd500;  /* down  - yellow */
  --c-L: #ff5800;  /* left  - orange */
  --c-R: #c41e3a;  /* right - red    */
  --c-F: #009e60;  /* front - green  */
  --c-B: #0051ba;  /* back  - blue   */

  --turn-ease: cubic-bezier(.34, .9, .4, 1);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
}

body {
  background:
    radial-gradient(120% 80% at 50% -10%, var(--bg-glow) 0%, transparent 60%),
    var(--bg);
  opacity: 0;
  transition: opacity .35s ease;
}
body.is-ready { opacity: 1; }

.shell {
  min-height: 100dvh;
  max-width: 720px;
  margin: 0 auto;
  /* notched phones in LANDSCAPE clip left/right, not just top/bottom */
  padding: max(12px, env(safe-area-inset-top))
           max(16px, env(safe-area-inset-right))
           calc(16px + env(safe-area-inset-bottom))
           max(16px, env(safe-area-inset-left));
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* ---- top bar ---------------------------------------------------------- */
.topbar {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.title {
  margin: 0;
  font-size: 1.35rem;
  font-weight: 650;
  letter-spacing: -.02em;
}
.status {
  margin: 0;
  font-size: .875rem;
  color: var(--text-dim);
  font-variant-numeric: tabular-nums;
  transition: color .2s ease;
}
.status--good { color: var(--good); font-weight: 600; }

/* ---- the cube stage --------------------------------------------------- */
.stage {
  flex: 1 1 auto;
  min-height: calc(var(--unit, var(--u)) * 5.4);
  display: grid;
  place-items: center;
  perspective: 1400px;
  perspective-origin: 50% 46%;
  /* a drag must never scroll the page or trigger pull-to-refresh */
  touch-action: none;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
  cursor: grab;
}
.stage:active { cursor: grabbing; }

.scene {
  width: calc(var(--unit, var(--u)) * 3);
  height: calc(var(--unit, var(--u)) * 3);
  transform-style: preserve-3d;
  display: grid;
  place-items: center;
}

/* The camera owns this transform. Nothing else writes it, and it must NOT transition —
   a transition here would lag every drag frame. */
.cube {
  position: relative;
  width: 0; height: 0;
  transform-style: preserve-3d;
  will-change: transform;
}

.cubie {
  position: absolute;
  width: var(--unit, var(--u));
  height: var(--unit, var(--u));
  margin-left: calc(var(--unit, var(--u)) / -2);
  margin-top: calc(var(--unit, var(--u)) / -2);
  transform-style: preserve-3d;
}

/* the layer a drag would turn, shown before the move commits */
.cubie.is-preview .facelet {
  box-shadow:
    inset 0 0 0 2px rgba(255, 255, 255, .9),
    inset 0 2px 6px rgba(255, 255, 255, .1);
  filter: brightness(1.18);
}

.facelet {
  position: absolute;
  inset: var(--gap);
  border-radius: 9%;
  background: #0a0c11;                       /* plastic body shows between stickers */
  box-shadow:
    inset 0 0 0 1px rgba(0, 0, 0, .55),
    inset 0 2px 6px rgba(255, 255, 255, .1);
  backface-visibility: hidden;
  overflow: hidden;
}
/* the sheen that makes a flat square read as moulded plastic */
.facelet-shine {
  position: absolute;
  inset: 0;
  background: linear-gradient(150deg, rgba(255, 255, 255, .3) 0%, rgba(255, 255, 255, .06) 38%, transparent 62%);
  pointer-events: none;
}

.facelet.c-U { background: var(--c-U); }
.facelet.c-D { background: var(--c-D); }
.facelet.c-L { background: var(--c-L); }
.facelet.c-R { background: var(--c-R); }
.facelet.c-F { background: var(--c-F); }
.facelet.c-B { background: var(--c-B); }

/* ---- control panel ---------------------------------------------------- */
.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.legend {
  float: right;
  font-weight: 500;
  letter-spacing: 0;
  text-transform: none;
  font-size: .78rem;
}
.section-heading--summary {
  cursor: pointer;
  list-style: revert;
  margin-bottom: 12px;
}
.settings[open] .section-heading--summary { margin-bottom: 12px; }

.section-heading {
  margin: 0 0 8px;
  font-size: .72rem;
  font-weight: 650;
  letter-spacing: .09em;
  text-transform: uppercase;
  color: var(--text-dim);
}

.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row--primary > .btn { flex: 1 1 auto; }

/* every interactive target clears the 44px minimum — v1's were ~37px */
.btn {
  min-height: 44px;
  padding: 0 16px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface-2);
  color: var(--text);
  font: inherit;
  font-weight: 550;
  cursor: pointer;
  transition: background .15s ease, border-color .15s ease, transform .06s ease;
}
.btn:hover:not(:disabled) { background: #232b3c; border-color: #3a4560; }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn--primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn--primary:hover:not(:disabled) { background: #5b98ff; border-color: #5b98ff; }
.btn--quiet { color: var(--text-dim); }
/* 44px is the floor for a touch target; these were 38px, which the review caught
   contradicting this file's own comment. */
.btn--small { min-height: 44px; padding: 0 14px; font-size: .85rem; }
.btn--toggle.is-on { background: var(--accent); border-color: var(--accent); color: #fff; }

.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
.chip {
  min-height: 44px;
  padding: 0 10px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: transparent;
  color: var(--text-dim);
  font: inherit;
  font-size: .8rem;
  cursor: pointer;
  text-transform: capitalize;
  transition: color .15s ease, border-color .15s ease;
}
.chip:hover { color: var(--text); border-color: #3a4560; }

/* ---- move grid: an actual grid, unlike v1's bare display:block --------- */
.move-grid {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
/* one row per face: name on the left, the two directions on the right. Six choices reading
   top to bottom beats a 3x3 of twelve small tiles pretending to be a keypad. */
.move-row {
  display: grid;
  grid-template-columns: 1fr auto auto;
  gap: 6px;
  align-items: center;
  padding: 5px 6px 5px 10px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-left: 4px solid currentColor;
  border-radius: 10px;
}
.move-row.c-U { color: var(--c-U); }
.move-row.c-D { color: var(--c-D); }
.move-row.c-L { color: var(--c-L); }
.move-row.c-R { color: var(--c-R); }
.move-row.c-F { color: var(--c-F); }
.move-row.c-B { color: var(--c-B); }

.move-label {
  text-align: left;
  background: none;
  font-size: .8rem;
  font-weight: 700;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--text);
}
/* The face colours are vivid but several fail contrast as TEXT on a dark surface (blue is
   about 2:1). The review flagged it, so identity comes from a swatch dot while the text itself
   stays readable. */
.move-label::before {
  content: "";
  display: inline-block;
  width: 8px; height: 8px;
  margin-right: 6px;
  border-radius: 50%;
  vertical-align: baseline;
  background: currentColor;
}
.move-label.c-U::before { background: var(--c-U); }
.move-label.c-D::before { background: var(--c-D); }
.move-label.c-L::before { background: var(--c-L); }
.move-label.c-R::before { background: var(--c-R); }
.move-label.c-F::before { background: var(--c-F); }
.move-label.c-B::before { background: var(--c-B); }

.move {
  min-height: 46px;
  min-width: 62px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #10141d;
  color: var(--text);
  font: inherit;
  font-weight: 400;
  font-size: 1.45rem;      /* the arrow is the label, so it needs to read at a glance */
  line-height: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  cursor: pointer;
  position: relative;
  transition: background .12s ease, transform .06s ease;
}
.move:hover { background: #1a2130; }
.move:active { transform: translateY(1px); }
.move--prime { color: var(--text-dim); }

.move-glyph { font-size: 1.3rem; line-height: 1; }
/* the notation sits under the arrow: always visible, never the only cue */
.move-notation {
  font-size: .72rem;
  font-weight: 700;
  letter-spacing: .04em;
  color: var(--text-dim);
  line-height: 1;
}
.move--letters .move-notation { font-size: 1.05rem; color: var(--text); }
.move--arrows .move-glyph { font-size: 1.45rem; }

.kbd-hint {
  margin: 10px 0 0;
  font-size: .76rem;
  color: var(--text-dim);
  line-height: 1.8;
}
kbd {
  display: inline-block;
  min-width: 20px;
  padding: 1px 5px;
  border: 1px solid var(--line);
  border-bottom-width: 2px;
  border-radius: 5px;
  background: var(--surface-2);
  font: inherit;
  font-size: .72rem;
  text-align: center;
}

/* ---- settings --------------------------------------------------------- */
.field { display: block; margin-bottom: 10px; }
.field-label {
  display: flex;
  justify-content: space-between;
  font-size: .8rem;
  color: var(--text-dim);
  margin-bottom: 6px;
}
.field-value { font-variant-numeric: tabular-nums; color: var(--text); }
.select {
  width: 100%;
  min-height: 44px;
  padding: 0 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface-2);
  color: var(--text);
  font: inherit;
}
/* a slider is dragged, not tapped, but it still needs a finger-sized grab area */
.range { width: 100%; accent-color: var(--accent); height: 44px; }
.hint { margin: -4px 0 10px; font-size: .78rem; color: var(--text-dim); }

.version { opacity: .8; font-variant-numeric: tabular-nums; }

.footer {
  margin-top: auto;
  padding-top: 4px;
  text-align: center;
  font-size: .74rem;
  color: #8a99b5;   /* was #5c6884 — below 4.5:1 on this background */
}


/* ---- guided solve ------------------------------------------------------ */
.guide {
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 12px;
}
.guide[hidden] { display: none; }
.guide-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.guide-head .section-heading { margin-bottom: 0; }

/* the seven stages, as a checklist you watch fill in */
.stage-list {
  list-style: none;
  margin: 10px 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.stage-item {
  display: grid;
  grid-template-columns: 18px 1fr auto;
  align-items: center;
  gap: 8px;
  padding: 5px 8px;
  border-radius: 7px;
  font-size: .82rem;
  color: var(--text-dim);
}
.stage-item.is-done { color: var(--good); }
.stage-item.is-current {
  background: rgba(76, 141, 255, .14);
  color: var(--text);
  font-weight: 600;
}
.stage-mark { text-align: center; font-weight: 700; }
.stage-count { font-variant-numeric: tabular-nums; font-size: .76rem; opacity: .8; }

/* the next move, given as much room as it deserves */
.next-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 10px;
}
.next-card--done { color: var(--good); font-weight: 600; text-align: center; }
.next-card--thinking { color: var(--text-dim); text-align: center; }
.next-kicker {
  font-size: .7rem;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 6px;
}
.next-move { display: flex; align-items: center; gap: 12px; }
.next-glyph {
  font-size: 2rem;
  line-height: 1;
  width: 44px; height: 44px;
  display: grid; place-items: center;
  border-radius: 10px;
  background: #10141d;
  border: 1px solid var(--line);
  border-bottom: 3px solid currentColor;
}
.next-glyph.c-U { color: var(--c-U); }
.next-glyph.c-D { color: var(--c-D); }
.next-glyph.c-L { color: var(--c-L); }
.next-glyph.c-R { color: var(--c-R); }
.next-glyph.c-F { color: var(--c-F); }
.next-glyph.c-B { color: var(--c-B); }
.next-label { font-size: .95rem; }
.next-label strong { font-size: 1.15rem; }
.next-alg {
  margin-top: 8px;
  font-size: .78rem;
  color: var(--accent);
  font-weight: 600;
}
.next-remaining {
  margin-top: 6px;
  font-size: .75rem;
  color: var(--text-dim);
  font-variant-numeric: tabular-nums;
}
.row--guide > .btn { flex: 1 1 auto; }
.guide-note { margin: 10px 0 0; }


/* ---- mode tabs --------------------------------------------------------- */
.tabs {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 4px;
  padding: 4px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
}
.tab {
  min-height: 44px;
  border: 0;
  border-radius: 9px;
  background: transparent;
  color: var(--text-dim);
  font: inherit;
  font-weight: 600;
  cursor: pointer;
  transition: background .15s ease, color .15s ease;
}
.tab:hover { color: var(--text); }
.tab.is-on { background: var(--accent); color: #fff; }

/* ---- timer ------------------------------------------------------------- */
.scramble-box {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.scramble-text {
  flex: 1 1 240px;
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  font-size: .92rem;
  letter-spacing: .04em;
  color: var(--text);
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 10px 12px;
  word-spacing: .35em;
  line-height: 1.5;
}

/* the pad is the main event: big, obviously pressable, and it changes colour by state */
.timer-pad {
  width: 100%;
  min-height: 132px;
  display: grid;
  place-content: center;
  gap: 6px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--surface-2);
  color: var(--text);
  cursor: pointer;
  font: inherit;
  text-align: center;
  touch-action: none;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  transition: background .12s ease, border-color .12s ease, color .12s ease;
}
.timer-time {
  font-size: clamp(2.4rem, 12vw, 3.6rem);
  font-weight: 300;
  font-variant-numeric: tabular-nums;
  line-height: 1;
  letter-spacing: -.02em;
}
.timer-hint { font-size: .8rem; color: var(--text-dim); }
.timer-pad--inspecting { background: #1d2740; border-color: #35507f; }
.timer-pad--inspecting.is-warning { background: #33291a; border-color: #7a5a22; }
.timer-pad--inspecting.is-danger { background: #3a1f22; border-color: #8a3a42; }
.timer-pad--ready { background: #143a2b; border-color: var(--good); color: var(--good); }
.timer-pad--ready .timer-hint { color: var(--good); }
.timer-pad--solving { background: #101722; border-color: var(--accent); }
.timer-pad--solving .timer-time { color: var(--accent); }

.row--penalty { margin-top: 10px; }
.row--penalty > .btn { flex: 1 1 auto; }
.btn.is-on { background: var(--accent); border-color: var(--accent); color: #fff; }

.stat-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 6px;
  margin-top: 12px;
}
.stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 8px 10px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 9px;
}
.stat-label {
  font-size: .66rem;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--text-dim);
}
.stat-value { font-size: 1.05rem; font-variant-numeric: tabular-nums; }

.splits { margin-top: 12px; }
.splits-head, .splits-foot {
  font-size: .7rem;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 6px;
}
.splits-foot { margin: 8px 0 0; text-transform: none; letter-spacing: 0; font-size: .78rem; }
.split-row {
  display: grid;
  grid-template-columns: 1fr auto auto;
  gap: 10px;
  padding: 4px 8px;
  font-size: .82rem;
  border-radius: 6px;
}
.split-row:nth-child(odd) { background: rgba(255, 255, 255, .03); }
.split-name { color: var(--text-dim); }
.split-delta { font-variant-numeric: tabular-nums; }
.split-total { font-variant-numeric: tabular-nums; color: var(--text-dim); min-width: 4.5em; text-align: right; }

.history-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 14px;
}
.history-head .section-heading { margin-bottom: 0; }
.history { list-style: none; margin: 8px 0 0; padding: 0; }
.history-row {
  display: grid;
  grid-template-columns: 3em 1fr 3em auto;
  gap: 8px;
  align-items: baseline;
  padding: 6px 8px;
  border-radius: 7px;
  font-size: .86rem;
}
.history-row:nth-child(odd) { background: rgba(255, 255, 255, .03); }
.history-row.is-dnf { color: var(--text-dim); text-decoration: line-through; }
.history-n { color: var(--text-dim); font-size: .76rem; }
.history-time { font-variant-numeric: tabular-nums; font-weight: 600; }
.history-pen { color: #ff9c6b; font-size: .76rem; }
.history-moves { color: var(--text-dim); font-size: .76rem; text-align: right; }
.history-empty { color: var(--text-dim); font-size: .86rem; padding: 6px 8px; }

/* ---- trainer ----------------------------------------------------------- */
.chips--groups { margin-left: 0; margin-bottom: 10px; }
.chip.is-on { background: var(--accent); border-color: var(--accent); color: #fff; }
.case-card {
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 10px;
}
.case-card--done { border-color: var(--good); color: var(--good); }
.case-name { font-size: 1.05rem; font-weight: 650; margin-bottom: 4px; }
.case-note { font-size: .84rem; color: var(--text-dim); line-height: 1.5; }
.case-alg {
  margin-top: 10px;
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  font-size: .95rem;
  letter-spacing: .04em;
  word-spacing: .3em;
  color: var(--accent);
}
.case-alg.is-hidden { color: var(--text-dim); font-style: italic; font-family: inherit; letter-spacing: 0; }
.case-setup { margin-top: 6px; font-size: .74rem; color: var(--text-dim); font-family: ui-monospace, monospace; }

/* ---- settings checkbox ------------------------------------------------- */
.field--check {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 10px;
  align-items: start;
  padding: 10px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 9px;
}
/* The checkbox glyph stays a sensible size; the TAP TARGET is the whole label, which is what
   WCAG 2.5.8 actually measures. The label below is padded to clear 44px. */
.field--check { min-height: 44px; cursor: pointer; }
.field--check input { width: 24px; height: 24px; margin-top: 2px; accent-color: var(--accent); flex: none; }
.check-body { font-size: .86rem; }
.check-body .hint { display: block; margin: 4px 0 0; }

  pendingUndos = 0;
  state = solvedCube();
  history = [];
  clearPreview();
  paint(state);
  refreshStatus();
  guide?.invalidate();
}

/**
 * Put the cube into a state immediately, with no animation and no history.
 * The timer and the trainer both need this: a scramble you watch play out is a scramble you
 * have already started inspecting, and a drill case should simply be there.
 */
function applyInstant(movesOrState) {
  engine.cancel();
  pendingUndos = 0;
  clearPreview();
  if (Array.isArray(movesOrState)) {
    let s = state;
    for (const m of movesOrState) s = turn(s, m);
    state = s;
  } else {
    state = movesOrState;
  }
  history = [];
  paint(state);
  refreshStatus();
  guide?.invalidate();
}

// ---- the move grid (the only part that is ever rebuilt) ------------------------------
function buildMoveGrid() {
  const grid = $("move-grid");
  if (!grid) return;
  clearPreview();
  grid.replaceChildren();

  for (const { move, name } of MOVE_BUTTONS) {
    const row = document.createElement("div");
    row.className = `move-row c-${move}`;

    const label = document.createElement("span");
    label.className = `move-label c-${move}`;
    label.textContent = name;
    row.appendChild(label);

    for (const m of [move, `${move}'`]) {
      const anti = m.endsWith("'");
      const b = document.createElement("button");
      b.type = "button";
      b.className = `move c-${move} move--${notation}${anti ? " move--prime" : ""}`;
      b.dataset.move = m;
      if (notation !== "letters") {
        const g = document.createElement("span");
        g.className = "move-glyph";
        g.textContent = anti ? "↺" : "↻";
        b.appendChild(g);
      }
      if (notation !== "arrows") {
        const n = document.createElement("span");
        n.className = "move-notation";
        n.textContent = anti ? `${move}′` : move;
        b.appendChild(n);
      }
      b.setAttribute("aria-label", `Turn the ${name.toLowerCase()} face ${anti ? "counter-clockwise" : "clockwise"}`);
      b.title = b.getAttribute("aria-label");
      b.addEventListener("click", () => play(m));
      const show = () => { if (!engine.busy) previewLayer(m, `btn:${m}`); };
      const hide = () => previewLayer(null, `btn:${m}`);
      b.addEventListener("pointerenter", show);
      b.addEventListener("pointerleave", hide);
      b.addEventListener("focus", show);
      b.addEventListener("blur", hide);
      row.appendChild(b);
    }
    grid.appendChild(row);
  }
}

// ---- modes ----------------------------------------------------------------------------
function buildTabs() {
  const tabs = $("tabs");
  if (!tabs) return;
  tabs.replaceChildren();
  for (const m of MODES) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "tab";
    b.id = `tab-${m.id}`;
    b.dataset.mode = m.id;
    b.textContent = m.label;
    b.setAttribute("role", "tab");
    b.addEventListener("click", () => setMode(m.id));
    tabs.appendChild(b);
  }
}

function setMode(next) {
  if (!MODES.some((m) => m.id === next)) next = "play";
  // leaving a mode must shut it down: a timer counting in a hidden tab, or a drill case still
  // armed, would both surprise you when you came back
  if (mode === "timer" && next !== "timer") timerPanel?.suspend();
  if (mode === "train" && next !== "train") trainPanel?.suspend();
  mode = next;
  try { localStorage.setItem(MODE_KEY, mode); } catch { }

  for (const m of MODES) {
    const panel = $(m.panel);
    if (panel) panel.hidden = m.id !== mode;
    const tab = $(`tab-${m.id}`);
    if (tab) {
      tab.classList.toggle("is-on", m.id === mode);
      tab.setAttribute("aria-selected", String(m.id === mode));
    }
  }
  guide?.setActive(mode === "guide");
  if (mode === "timer") timerPanel?.render();
  if (mode === "train") trainPanel?.render();
}

// ---- everything else, wired exactly once ---------------------------------------------
function wireStaticControls() {
  $("scramble")?.addEventListener("click", doScramble);
  $("reset")?.addEventListener("click", restoreSolved);
  $("undo")?.addEventListener("click", undo);
  $("reset-view")?.addEventListener("click", () => camera.reset());

  const lock = $("lock");
  if (lock) {
    const sync = () => {
      lock.setAttribute("aria-pressed", String(camera.locked));
      lock.textContent = camera.locked ? "Orbit locked" : "Orbit on";
      lock.classList.toggle("is-on", camera.locked);
    };
    lock.addEventListener("click", () => { camera.toggleLock(); sync(); });
    sync();
  }

  const views = $("view-presets");
  if (views) {
    views.replaceChildren();
    for (const name of SNAP_VIEWS) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "chip";
      b.textContent = name;
      b.addEventListener("click", () => camera.snapTo(name));
      views.appendChild(b);
    }
  }

  const sel = $("scheme");
  if (sel) {
    sel.replaceChildren();
    for (const s of SCHEMES) {
      const o = document.createElement("option");
      o.value = s.id; o.textContent = s.label;
      sel.appendChild(o);
    }
    sel.value = scheme;
    const applyScheme = () => {
      scheme = sel.value;
      try { localStorage.setItem(SCHEME_KEY, scheme); } catch { }
      const h = $("scheme-hint");
      if (h) h.textContent = SCHEMES.find((s) => s.id === scheme)?.hint ?? "";
    };
    sel.addEventListener("change", applyScheme);
    applyScheme();
  }

  const nsel = $("notation");
  if (nsel) {
    nsel.replaceChildren();
    for (const n of NOTATIONS) {
      const o = document.createElement("option");
      o.value = n.id; o.textContent = n.label;
      nsel.appendChild(o);
    }
    nsel.value = notation;
    nsel.addEventListener("change", () => {
      notation = nsel.value;
      try { localStorage.setItem(NOTATION_KEY, notation); } catch { }
      buildMoveGrid();
    });
  }

  const speed = $("speed");
  if (speed) {
    const applySpeed = () => {
      const mult = Number(speed.value);
      engine.setSpeed(mult);
      const out = $("speed-value");
      if (out) out.textContent = `${mult.toFixed(2)}x`;
    };
    speed.addEventListener("input", applySpeed);
    applySpeed();
  }

  const sm = $("speedmode");
  if (sm) {
    sm.checked = speedMode;
    const applySpeedMode = () => {
      speedMode = sm.checked;
      try { localStorage.setItem(SPEEDMODE_KEY, speedMode ? "1" : "0"); } catch { }
      setSpeedMode(speedMode);
      // a fixed, known angle is the whole point: you learn one view and stop re-orienting
      if (speedMode) { camera.snapTo("home"); camera.setLocked(true); }
      else camera.setLocked(false);
      $("lock")?.dispatchEvent(new Event("sync-request"));
      const lockBtn = $("lock");
      if (lockBtn) {
        lockBtn.setAttribute("aria-pressed", String(camera.locked));
        lockBtn.textContent = camera.locked ? "Orbit locked" : "Orbit on";
        lockBtn.classList.toggle("is-on", camera.locked);
      }
      document.body.classList.toggle("is-speedmode", speedMode);
    };
    sm.addEventListener("change", applySpeedMode);
    if (speedMode) applySpeedMode();
  }
}

function start() {
  const mount = $("cube");
  if (!mount) { console.error("no #cube mount element"); return; }

  try {
    scheme = localStorage.getItem(SCHEME_KEY) || scheme;
    notation = localStorage.getItem(NOTATION_KEY) || notation;
    speedMode = localStorage.getItem(SPEEDMODE_KEY) === "1";
  } catch { }

  const unit = unitPxForViewport();
  const cubeEl = mountCube(mount, unit);
  document.documentElement.style.setProperty("--unit", `${unit}px`);

  camera = createCamera({ cubeEl });
  engine = createTurnEngine({
    getCubies,
    getUnitPx: () => unitPxForViewport(),
    commit: commitMove,
    onIdle: () => { refreshStatus(); guide?.onIdle(); },
  });

  guide = createGuide({
    root: $("guide"),
    getState: () => state,
    play,
    preview: (m) => previewLayer(m, "guide"),
    isBusy: () => engine.busy,
    onAuto: () => { },
  });

  session = createSession();
  timerPanel = createTimerPanel({
    root: $("panel-timer"),
    session,
    applyScramble: (moves) => applyInstant(moves),
    getState: () => state,
    onArmedChange: (armed) => document.body.classList.toggle("is-timing", armed),
  }).mount();

  trainPanel = createTrainerPanel({
    root: $("panel-train"),
    applyState: (s) => applyInstant(s),
    playMoves: (moves) => play(moves),
    getState: () => state,
  }).mount();

  paint(state);
  buildTabs();
  wireStaticControls();
  buildMoveGrid();
  refreshStatus();

  attachInput({
    stageEl: mount,
    camera,
    onMove: play,
    onPreview: (m) => previewLayer(m, "drag"),
    getScheme: () => scheme,
    isBusy: () => engine.busy,
  });

  let saved = "play";
  try { saved = localStorage.getItem(MODE_KEY) || "play"; } catch { }
  setMode(saved);

  let resizeTimer = null;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      const u = unitPxForViewport();
      resize(u);
      document.documentElement.style.setProperty("--unit", `${u}px`);
    }, 120);
  });

  // the visible release label, read from the one canonical constant
  const ver = $("version");
  if (ver) ver.textContent = versionLabel();

  document.body.classList.add("is-ready");
}

if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start);
else start();

return {  };
};
