<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Astro Racing controlled item playtest</title><style>body{margin:0;background:#103641;color:#fff0c8;font:16px system-ui}header{padding:14px 20px}h1{font-size:21px;margin:0 0 6px}p{margin:5px 0}button,a{display:inline-block;background:#efba69;color:#163a45;border:0;border-radius:6px;padding:9px 12px;margin:5px 6px 0 0;font:inherit;cursor:pointer}iframe{width:100%;height:calc(100vh - 190px);min-height:420px;border:0}#status{min-height:24px}small{color:#b1d6cf}</style>
<header><h1>Controlled item playtest</h1><p>Forced inventory and staged targets. This demonstration does not measure natural pickup frequency.</p><button data-demo="contact">Coco contact</button><button data-demo="shield">Shielded contact</button><button data-demo="intercept">Projectile interception</button><button data-demo="single">Single Soda</button><button data-demo="triple">Triple Soda</button><a href="./">Return to natural racing</a><p id="status">Loading the local game…</p><small>After selecting a boost, click the game and press Q (or the touch Item button). Use each charge separately.</small></header><iframe id="game" src="./?verify" title="Astro Racing controlled demonstration"></iframe>
<script>
const frame=document.getElementById('game'),status=document.getElementById('status');let pending,monitor;
const ready=setInterval(()=>{if(frame.contentWindow.astroDebug?.game){clearInterval(ready);status.textContent='Choose a demonstration. Contact scenes pause briefly before the collision.';}},100);
for(const button of document.querySelectorAll('[data-demo]'))button.onclick=()=>{clearTimeout(pending);clearInterval(monitor);window.demoResult=null;window.demoHit=null;const g=frame.contentWindow.astroDebug?.game;if(!g)return;g.input.clear();g.changeTrack('classic');g.configure({...g.selection,driver:'nadia'});g.race.reset('hard');for(const pickup of g.track.pickups??[])g.race.items.pickupCooldowns.set(pickup.id,Infinity);g.race.bots.forEach(bot=>bot.update=()=>({throttle:0,brake:0,steer:0,drift:false}));g.race.racers.forEach((r,i)=>r.grid(350+i*22,0));const r=g.race.player;r.grid(70,0);g.race.status='grid';g.race.countdown=60;g.setScreen('driving');g.chase.snap(r.state);const kind=button.dataset.demo;
if(kind==='single'||kind==='triple'){r.item=kind==='single'?'boost':'tripleBoost';r.charges=kind==='single'?1:3;g.race.status='racing';status.textContent=kind==='single'?'FORCED SINGLE: press Q once; inventory should empty and boost should activate.':'FORCED TRIPLE: press Q three separate times; watch 3 → 2 → 1 → empty.';}
else{r.item='triple';r.charges=kind==='intercept'?1:3;r.orbitMask=kind==='intercept'?1:7;const k=r.state,slot=kind==='intercept'?0:1,a=slot*Math.PI*2/3+k.heading,p={x:k.x+Math.sin(a)*2,y:k.y+1.05+Math.cos(slot*Math.PI*2/3*2)*.12,z:k.z+Math.cos(a)*2};
if(kind==='intercept'){status.textContent='FORCED INTERCEPTION: one orbiting coconut meets a fast incoming Coco. Both should disappear; Nadia should remain unstunned.';pending=setTimeout(()=>{g.race.items.projectiles.push({id:9999,owner:1,x:p.x+Math.sin(k.heading)*5,y:p.y,z:p.z+Math.cos(k.heading)*5,vx:-Math.sin(k.heading)*240,vz:-Math.cos(k.heading)*240,vy:0,life:3,age:1,route:k.route,progress:k.progress,kind:'coco',bounces:0,distance:0,wallContact:''});g.race.status='racing';},900);}
else{const target=g.race.racers[1];target.grid(70,0);Object.assign(target.state,{x:p.x,y:p.y-1,z:p.z});target.physics.previous={...target.state};target.shield=kind==='shield'?4:0;const actualHit=target.hit.bind(target);target.hit=()=>{const outcome=actualHit();window.demoHit=outcome;return outcome;};window.demoHit=null;status.textContent=kind==='shield'?'FORCED SHIELDED CONTACT: one coconut and the bubble are spent; the target is protected from the hit.':'FORCED CONTACT: one coconut is spent; the unshielded target receives the normal Coco hit.';pending=setTimeout(()=>g.race.status='racing',900);}}
if(!['single','triple'].includes(kind)){const initial=r.charges;monitor=setInterval(()=>{if(r.charges<initial){clearInterval(monitor);window.demoResult={charges:r.charges,mask:r.orbitMask,stun:r.stun,targetOutcome:window.demoHit??null,targetShield:g.race.racers[1].shield,projectiles:g.race.items.projectiles.length};g.race.status='grid';g.race.countdown=3600;status.textContent+=' Result paused: '+r.charges+' coconut'+(r.charges===1?'':'s')+' remaining.';}},25);}frame.contentWindow.focus();};
</script></html>
